services:
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: student
      RABBITMQ_DEFAULT_PASS: student
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbit_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  orders:
    build: .
    environment: {ROLE: orders, DB: /data/orders.db}
    ports: ["8001:8000"]
    volumes: ["orders_data:/data"]
  repairs:
    build: .
    environment: {ROLE: repairs, DB: /data/repairs.db}
    ports: ["8002:8000"]
    volumes: ["repairs_data:/data"]
  orders_worker:
    build: .
    command: ["python", "worker.py"]
    restart: on-failure
    environment:
      ROLE: orders
      DB: /data/orders.db
      AMQP_URL: amqp://student:student@rabbitmq:5672/
    volumes: ["orders_data:/data"]
    depends_on:
      rabbitmq: {condition: service_healthy}
  repairs_worker:
    build: .
    command: ["python", "worker.py"]
    restart: on-failure
    environment:
      ROLE: repairs
      DB: /data/repairs.db
      AMQP_URL: amqp://student:student@rabbitmq:5672/
    volumes: ["repairs_data:/data"]
    depends_on:
      rabbitmq: {condition: service_healthy}
volumes:
  rabbit_data:
  orders_data:
  repairs_data:
